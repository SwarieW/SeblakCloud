version: '3.8'

services:
  # 1. PostgreSQL Authentication Database
  auth-db:
    image: postgres:15-alpine
    container_name: auth_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./database-data/postgres:/var/lib/postgresql/data
    networks:
      - kantinA_net

  # 2. MongoDB Transactions Database
  main-db:
    image: mongo:6
    container_name: main_mongo
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: canteen_db
    ports:
      - "27017:27017"
    volumes:
      - ./database-data/mongo:/data/db
    networks:
      - kantinA_net

  # 3. Auth Microservice
  auth-service:
    build: ./auth-service
    container_name: auth_microservice
    restart: always
    environment:
      PORT: 4000
    env_file:
      - .env
    depends_on:
      - auth-db
    networks:
      - kantinA_net

  # 4. Main Canteen Microservice
  main-service:
    build: ./main-service
    container_name: main_microservice
    restart: always
    environment:
      PORT: 4001
    env_file:
      - .env
    depends_on:
      - main-db
    networks:
      - kantinA_net

  # 5. Gateway / Frontend Microservice
  gateway:
    build: ./gateway
    container_name: gateway_microservice
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    env_file:
      - .env
    depends_on:
      - auth-service
      - main-service
    networks:
      - kantinA_net

networks:
  kantinA_net:
    driver: bridge