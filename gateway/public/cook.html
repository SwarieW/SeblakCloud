<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin & Kitchen Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #2f3542; color: #fff; }
    .navbar { background: #1e272e; padding: 15px 20px; display: flex; gap: 10px; }
    .nav-btn { background: #57606f; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .nav-btn.active { background: #1e90ff; }
    .tab-content { display: none; padding: 20px; max-width: 1200px; margin: auto; }
    .tab-content.active { display: block; }
    
    /* Queue Styles */
    .order-card { background: #57606f; padding: 16px; border-radius: 8px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .status-QUEUED { border-left: 6px solid #ffa502; }
    .status-COOKING { border-left: 6px solid #1e90ff; }
    
    /* Tables & Forms */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #57606f; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #747d8c; }
    th { background: #1e272e; }
    .form-group { display: flex; gap: 10px; margin-bottom: 20px; background: #57606f; padding: 15px; border-radius: 8px; }
    input, select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; flex: 1; }
    
    button { padding: 8px 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
    .btn-blue { background: #1e90ff; color: white; }
    .btn-green { background: #2ed573; color: white; }
    .btn-red { background: #ff4757; color: white; }
    
    .chart-container { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="nav-btn active" onclick="switchTab('queue')" id="btn-queue">🍳 Live Queue</button>
    <button class="nav-btn" onclick="switchTab('transactions')" id="btn-transactions">📊 Transactions</button>
    <button class="nav-btn" onclick="switchTab('menu')" id="btn-menu">📋 Menu List</button>
  </div>

  <!-- TAB 1: LIVE QUEUE -->
  <div id="tab-queue" class="tab-content active">
    <h2>Kitchen FIFO Queue</h2>
    <div id="queue-list">Loading queue...</div>
  </div>

  <!-- TAB 2: TRANSACTIONS -->
  <div id="tab-transactions" class="tab-content">
    <h2>Transaction History & Revenue</h2>
    <div class="chart-container">
      <canvas id="revenueChart" height="80"></canvas>
    </div>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Customer</th>
          <th>Items</th>
          <th>Total Amount (Rp)</th>
        </tr>
      </thead>
      <tbody id="tx-table-body"></tbody>
    </table>
  </div>

  <!-- TAB 3: MENU LIST -->
  <div id="tab-menu" class="tab-content">
    <h2>Manage Menu</h2>
    <div class="form-group">
      <input type="text" id="new-menu-name" placeholder="Item Name (e.g. Seblak Ceker)">
      <input type="number" id="new-menu-price" placeholder="Price (e.g. 15000)">
      <select id="new-menu-category">
        <option value="Food">Food</option>
        <option value="Beverage">Beverage</option>
      </select>
      <button class="btn-green" onclick="addMenuItem()">+ Add Item</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Price (Rp)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="menu-table-body"></tbody>
    </table>
  </div>

  <script>
    let revenueChartInstance = null;

    // --- Tab Navigation Logic ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`btn-${tabId}`).classList.add('active');

      if (tabId === 'queue') loadQueue();
      if (tabId === 'transactions') loadTransactions();
      if (tabId === 'menu') loadMenu();
    }

    // --- Tab 1: Live Queue ---
    async function loadQueue() {
      const res = await fetch('/api/canteen/orders/fifo');
      const queue = await res.json();
      const container = document.getElementById('queue-list');
      
      if (queue.length === 0) return container.innerHTML = '<h3>No pending orders! 🎉</h3>';

      container.innerHTML = queue.map((order, idx) => `
        <div class="order-card status-${order.orderStatus}">
          <div>
            <h3>#${idx + 1} - ${order.customerName} <small>(${order.orderStatus})</small></h3>
            <ul>${order.items.map(i => `<li>${i.name} x${i.quantity}</li>`).join('')}</ul>
            <strong>Total: Rp ${order.totalAmount.toLocaleString()}</strong>
          </div>
          <div>
            ${order.orderStatus === 'QUEUED' 
              ? `<button class="btn-blue" onclick="updateOrderStatus('${order._id}', 'COOKING')">Start Cooking</button>` 
              : `<button class="btn-green" onclick="updateOrderStatus('${order._id}', 'COMPLETED')">Mark Completed</button>`}
          </div>
        </div>
      `).join('');
    }

    async function updateOrderStatus(id, status) {
      await fetch(`/api/canteen/orders/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderStatus: status })
      });
      loadQueue();
    }

    // --- Tab 2: Transactions & Chart ---
    async function loadTransactions() {
      const res = await fetch('/api/canteen/orders/completed');
      const txs = await res.json();
      
      // Populate Table
      const tbody = document.getElementById('tx-table-body');
      tbody.innerHTML = txs.map(tx => `
        <tr>
          <td>${new Date(tx.createdAt).toLocaleString()}</td>
          <td>${tx.customerName}</td>
          <td>${tx.items.map(i => i.name).join(', ')}</td>
          <td>${tx.totalAmount.toLocaleString()}</td>
        </tr>
      `).join('');

      // Aggregate data for Chart.js
      const dailyData = {};
      txs.forEach(tx => {
        const dateStr = new Date(tx.createdAt).toLocaleDateString();
        dailyData[dateStr] = (dailyData[dateStr] || 0) + tx.totalAmount;
      });

      const labels = Object.keys(dailyData).reverse();
      const data = Object.values(dailyData).reverse();

      // Render Chart
      const ctx = document.getElementById('revenueChart').getContext('2d');
      if (revenueChartInstance) revenueChartInstance.destroy();
      
      revenueChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Daily Revenue (Rp)',
            data: data,
            backgroundColor: '#1e90ff',
            borderRadius: 4
          }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });
    }

    // --- Tab 3: Menu Management ---
    async function loadMenu() {
      const res = await fetch('/api/canteen/menu');
      const menu = await res.json();
      
      document.getElementById('menu-table-body').innerHTML = menu.map(item => `
        <tr>
          <td>${item.name}</td>
          <td>${item.category}</td>
          <td>${item.price.toLocaleString()}</td>
          <td><button class="btn-red" onclick="deleteMenuItem('${item._id}')">Delete</button></td>
        </tr>
      `).join('');
    }

    async function addMenuItem() {
      const name = document.getElementById('new-menu-name').value;
      const price = document.getElementById('new-menu-price').value;
      const category = document.getElementById('new-menu-category').value;

      if (!name || !price) return alert('Name and Price are required!');

      await fetch('/api/canteen/menu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price: Number(price), category })
      });

      document.getElementById('new-menu-name').value = '';
      document.getElementById('new-menu-price').value = '';
      loadMenu();
    }

    async function deleteMenuItem(id) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      await fetch(`/api/canteen/menu/${id}`, { method: 'DELETE' });
      loadMenu();
    }

    // Initialize the default tab
    loadQueue();
    setInterval(() => {
      if (document.getElementById('tab-queue').classList.contains('active')) loadQueue();
    }, 3000); // Only auto-poll if looking at the queue
  </script>
</body>
</html>
